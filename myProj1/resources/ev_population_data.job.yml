#This is resource yml file for the Job "ev population data"
resources:
  jobs:
    ev_population_data:
      name: ev_population_data

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key : ext_ev_population
          spark_python_task:
            python_file: ../controller_driver/data_ingestion_from_csv_driver.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--src"
              - "/Volumes/dbacademy_learning/sourcedataset/source_dataset/Electric_Vehicle_Population_Data.csv"
              - "--tgt_tbl"
              - "tbl_ev_population"
          environment_key: default
        - task_key : ext_daily_aqi
          spark_python_task:
            python_file: ../controller_driver/data_ingestion_from_csv_driver.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--src"
              - "/Volumes/dbacademy_learning/sourcedataset/source_dataset/aqi_report.csv"
              - "--tgt_tbl"
              - "tbl_daily_aqi"
          environment_key: default        
      environments:
        - environment_key: default
          spec:
            environment_version: "4"          