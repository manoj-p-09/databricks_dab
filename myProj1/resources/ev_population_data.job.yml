#This is resource yml file for the Job "ev population data"
resources:
  jobs:
    ev_population_data:
      name: ev_population_data

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key : ext_ev_population
          spark_python_task:
            python_file: ../controller_driver/ext_ev_population_driver.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"          